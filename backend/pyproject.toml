[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "geolens-backend"
version = "0.1.0"
description = "GeoLens FastAPI service"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "beautifulsoup4>=4.13,<5",
    "celery[redis]>=5.5,<6",
    "defusedxml>=0.7.1,<1",
    "fastapi>=0.141.1,<1",
    "httpx>=0.28.1,<1",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "uvicorn[standard]>=0.52,<1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21,<1",
    "mypy>=1.16,<2",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.16,<1",
    "types-defusedxml>=0.7.0.20250822,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/geolens_api"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: requires a PostgreSQL database identified by TEST_DATABASE_URL",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
strict = true
files = ["src", "tests"]
